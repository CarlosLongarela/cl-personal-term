##### terminal y colores (windows terminal + wsl) #####

set -g default-terminal "screen-256color"
set -as terminal-overrides ",xterm-256color:Tc"
set -as terminal-overrides ",screen-256color:Tc"

set -g default-shell /bin/bash

##### prefijo más cómodo #####
# Cambiamos Ctrl-b por Ctrl-a (estilo screen, mucho más rápido)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

##### rendimiento y respuesta #####

set -sg escape-time 10
set -g history-limit 200000
set -g mouse on

##### numeración lógica #####

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

##### estado (barra inferior) #####
set -g status on
set -g status-interval 5

# Colores base
set -g status-style "bg=#1e1e1e,fg=#c0c0c0"

# Lado izquierdo: sesión + usuario@host
set -g status-left-length 50
set -g status-left "#[fg=#00afff,bold] #S #[fg=#666666]| #[fg=#87afff]#(whoami)@#H "

# Lado derecho: fecha + hora
set -g status-right-length 80
set -g status-right "#[fg=#666666]%Y-%m-%d #[fg=#00d7af]%H:%M "

# Ventanas inactivas
setw -g window-status-format "#[fg=#666666] #I:#W "

# Separadores
setw -g window-status-separator " "

# Ventana activa
# Hook que cambia color según la ventana activa
set-hook -g after-select-window 'if-shell "[ #{window_name} = remote ]" "set -g status-style bg=#ff0000" "set -g status-style bg=#1e1e1e"'

##### split de paneles más natural #####

# Horizontal / Vertical estilo vim
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

##### navegación entre paneles (vim style) #####

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

##### redimensionar paneles rápidamente #####

bind -r H resize-pane -L 10
bind -r L resize-pane -R 10
bind -r K resize-pane -U 5
bind -r J resize-pane -D 5

##### copiar/pegar (muy importante en admin) #####

setw -g mode-keys vi

bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send -X copy-selection-and-cancel

##### recargar config sin salir #####

bind r source-file ~/.tmux.conf \; display "tmux.conf recargado"

##### ventanas rápidas para tareas típicas #####

# Ventana logs
bind L new-window -n logs

# Ventana WordPress / WP-CLI
bind W new-window -n wordpress

# Ventana servidor general
bind S new-window -n server

##### layouts útiles #####

# layout clásico admin: editor + shell + logs
bind E \
    split-window -v \; \
    split-window -h \; \
    select-pane -t 1 \; \
    split-window -h

##### copiar texto con el ratón sin romper selección #####

bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection-and-cancel

##### evitar que tmux cambie el título de windows terminal #####

set -g allow-rename off
setw -g automatic-rename off
